<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FHIR KFI dbt Model — Docs</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0">
  <meta name="description" content="Design documentation for the FHIR KFI dbt model project">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'fhir-kfi-dbt-model',
      repo: 'carrollaboratory/fhir-kfi-dbt-model',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      mermaidConfig: {
        theme: 'neutral'
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
  <script>
    // docsify-mermaid's own auto-init hook is unreliable (unmaintained plugin,
    // races against docsify's route render), so trigger mermaid explicitly
    // after every page render instead of depending on it.
    window.$docsify.plugins = [].concat(function (hook) {
      hook.doneEach(function () {
        if (window.mermaid) {
          window.mermaid.init(undefined, document.querySelectorAll('.mermaid'));
        }
      });
    }, window.$docsify.plugins || []);
  </script>
</body>
</html>
