[project]
name = "fhir-kfi-dbt-model"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dbt-core>=1.8.0 ",
    "dbt-postgres>=1.8.0 ",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "rich>=15.0.0",
    "sqlfluff>=4.2.2",
    "sqlfluff-templater-dbt>=4.2.2",
]

[tool.setuptools]
packages = ["scripts"]

[tool.uv]
package = true

[tool.uv.sources]
spit-fhir = { git = "https://github.com/carrollaboratory/spit-fhir" }

[dependency-groups]
dev = [
    "spit-fhir",
]
