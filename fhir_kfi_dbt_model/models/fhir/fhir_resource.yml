version: 2

models:
  - name: fhir_resource
    description: >
      FHIR Resources

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - id
            - resource_type

    columns:
      - name: id
        description: >
          FHIR Consent.id. Equals access_policy_id. Minted by Dewrangle (coGlobalID).
        tests:
          - not_null
          - unique

      - name: resource_type
        description: Hardcoded string 'Consent'.
        tests:
          - not_null
          - accepted_values:
              values:
                - Consent
                - ResearchStudy

      - name: access_policy_id
        description: >
          Access policy key column. Equals id for this model. Present on all FHIR models
          to support cross-resource joins and extraction filtering.
        tests:
          - not_null

      - name: resource
        description: >
          Full FHIR R4 Consent resource as jsonb.
        tests:
          - not_null
