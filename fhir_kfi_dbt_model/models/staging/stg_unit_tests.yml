version: 2
unit_tests:
- name: Research Study to ResearchStudy
  description: Validates the conversion of research study data
  model: stg_research_study
  given:
  - input: source('dev_include_access', 'study')
    format: csv
    fixture: mock_study
  - input: source('dev_include_access', 'study_external_id')
    format: csv
    fixture: mock_study_external_id
  - input: source('dev_include_access', 'study_program')
    format: csv
    fixture: mock_study_program
  - input: source('dev_include_access', 'investigator')
    format: csv
    fixture: mock_investigator
  - input: source('dev_include_access', 'study_principal_investigator')
    format: csv
    fixture: mock_study_principal_investigator
  - input: source('dev_include_access', 'study_contact')
    format: csv
    fixture: mock_study_contact
  - input: source('dev_include_access', 'doi')
    format: csv
    fixture: mock_doi
  - input: source('dev_include_access', 'doi_external_id')
    format: csv
    fixture: mock_doi_external_id
  - input: source('dev_include_access', 'publication')
    format: csv
    fixture: mock_publication
  - input: source('dev_include_access', 'study_publication')
    format: csv
    fixture: mock_study_publication
  - input: source('dev_include_access', 'publication_external_id')
    format: csv
    fixture: mock_publication_external_id
  expect:
    format: csv
    fixture: mock_results_stg_research_study
- name: Access Policy to Consent
  description: Validates the conversion of access policy into consent
  model: stg_consent
  given:
  - input: source('dev_include_access', 'access_policy')
    format: csv
    fixture: mock_access_policy
  expect:
    format: csv
    fixture: mock_results_stg_consent
